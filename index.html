<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بيجي موبايل - عروض ومكافآت الموسم</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #27090d 0%, #110709 60%, #090506 100%);
      color: #ffffff;
      padding: 18px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(24, 12, 15, 0.94);
      border: 1px solid rgba(255, 65, 85, 0.35);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .top-bar h1 {
      font-size: 18px;
      color: #ffffff;
    }

    .top-tag {
      background: rgba(255, 59, 82, 0.16);
      color: #ff6b7c;
      border: 1px solid rgba(255, 59, 82, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .offers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .offer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(24, 12, 15, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .offer-row:hover {
      border-color: rgba(255, 65, 85, 0.45);
    }

    .offer-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .thumb-box {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      background: #1a0b0e;
      border: 1px solid rgba(255, 65, 85, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-placeholder {
      font-size: 10px;
      color: #b79fa4;
      text-align: center;
      padding: 2px;
    }

    .offer-info {
      min-width: 0;
    }

    .offer-title {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .offer-sub {
      font-size: 12px;
      color: #cbb8bc;
    }

    .select-btn {
      flex-shrink: 0;
      padding: 9px 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff2e4c, #b8112b);
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .select-btn:active {
      transform: scale(0.97);
    }

    .result-box {
      margin-top: 16px;
      background: rgba(24, 12, 15, 0.95);
      border: 1px solid rgba(126, 242, 157, 0.35);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #7ef29d;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <h1>عروض ومكافآت ببجي موبايل</h1>
      <span class="top-tag">PUBG MOBILE</span>
    </div>

    <div class="offers-list" id="offersList">
      <!-- العرض الأول: الصورة المرفوعة حالياً raven.png -->
      <div class="offer-row">
        <div class="offer-left">
          <div class="thumb-box">
            <img src="raven.png" alt="Blood Raven" />
          </div>
          <div class="offer-info">
            <div class="offer-title">Blood Raven</div>
            <div class="offer-sub">سكن ومكافآت الموسم (raven.png)</div>
          </div>
        </div>
        <button class="select-btn" type="button" data-offer="Blood Raven">اختيار</button>
      </div>

      <!-- أماكن جاهزة لباقي الخيارات والصور الـ 15 لاحقاً -->
      <div class="offer-row">
        <div class="offer-left">
          <div class="thumb-box">
            <span class="thumb-placeholder">img1.png</span>
          </div>
          <div class="offer-info">
            <div class="offer-title">عرض إضافي 1</div>
            <div class="offer-sub">جاهز لإضافة الصورة الصغيرة لاحقاً</div>
          </div>
        </div>
        <button class="select-btn" type="button" data-offer="عرض إضافي 1">اختيار</button>
      </div>

      <div class="offer-row">
        <div class="offer-left">
          <div class="thumb-box">
            <span class="thumb-placeholder">img2.png</span>
          </div>
          <div class="offer-info">
            <div class="offer-title">عرض إضافي 2</div>
            <div class="offer-sub">جاهز لإضافة الصورة الصغيرة لاحقاً</div>
          </div>
        </div>
        <button class="select-btn" type="button" data-offer="عرض إضافي 2">اختيار</button>
      </div>
    </div>

    <div class="result-box" id="resultBox">اختر أحد العروض من القائمة لعرض حالته.</div>
  </div>

  <script>
    const buttons = document.querySelectorAll(".select-btn");
    const resultBox = document.getElementById("resultBox");

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const offerName = btn.getAttribute("data-offer");
        resultBox.textContent = "تم تحديد العرض: " + offerName;
      });
    });
  </script>
</body>
</html>
