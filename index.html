<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بيجي موبايل - عرض مكافآت الموسم</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #2a090d 0%, #110709 60%, #090506 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(24, 12, 15, 0.94);
      border: 1px solid rgba(255, 65, 85, 0.38);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.68);
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(129, 16, 22, 0.25);
      border-bottom: 1px solid rgba(255, 65, 85, 0.22);
      font-size: 13px;
    }

    .brand {
      font-weight: bold;
      color: #ff6b7c;
    }

    .season-tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      color: #f3e4e7;
    }

    .image-box {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #16090b;
      overflow: hidden;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 18px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 59, 82, 0.16);
      color: #ff5b6e;
      border: 1px solid rgba(255, 59, 82, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p {
      font-size: 14px;
      line-height: 1.65;
      color: #d6c7ca;
      margin-bottom: 16px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff2e4c, #b8112b);
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.92;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #7ef29d;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header-bar">
      <span class="brand">PUBG MOBILE</span>
      <span class="season-tag">مكافآت الموسم</span>
    </div>

    <div class="image-box">
      <img src="raven.png" alt="Blood Raven" />
    </div>

    <div class="content">
      <span class="badge">عرض مميز</span>
      <h1>Blood Raven</h1>
      <p>معاينة سكن Blood Raven ضمن صفحة مكافآت الموسم؛ المسار مضبوط على الصورة المرفوعة مباشرة.</p>
      <button class="btn" id="claimBtn" type="button">تأكيد اختيار المكافأة</button>
      <div class="status" id="statusMsg"></div>
    </div>
  </main>

  <script>
    const btn = document.getElementById("claimBtn");
    const statusMsg = document.getElementById("statusMsg");

    btn.addEventListener("click", () => {
      statusMsg.textContent = "تم اختيار Blood Raven بنجاح.";
    });
  </script>
</body>
</html>
